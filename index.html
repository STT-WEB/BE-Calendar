<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C6DFFB">
<title>B&amp;E &middot; Our Calendar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127769;</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Sarabun:wght@300;400;500;600;700&display=swap');
:root{
  --ink:#2C3A57; --ink2:#4E5E7E; --muted:#8E9BB4;
  --line:#E1EAF6; --line2:#D7E5F7;
  --bg:#F1F7FE; --card:#FFFFFF;
  --blue:#6BA4E4; --blue-d:#3B72C4; --blue-l:#CFE3FA; --blue-xl:#EBF4FE;
  --gold:#C9A227;
  --beer:#2F62B8; --earth:#D9548A; --both:#7B5FC4;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Sarabun',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;font-family:var(--sans);
  padding-bottom:40px;
  background-image:
    radial-gradient(circle at 10% 2%, rgba(107,164,228,.20) 0, transparent 42%),
    radial-gradient(circle at 92% 10%, rgba(255,255,255,.95) 0, transparent 40%),
    radial-gradient(circle at 78% 60%, rgba(207,227,250,.35) 0, transparent 45%);
  background-attachment:fixed}

/* ===== WELCOME ===== */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;text-align:center;
  padding:min(6vh,46px) 24px 214px;overflow:hidden;
  background:
    radial-gradient(120% 70% at 50% 0%, #BBD8FB 0%, #D4E7FC 26%, #EAF2FD 48%, transparent 70%),
    linear-gradient(178deg,#A8CCF7 0%,#C6DFFB 18%,#E4EFFD 40%,#FBEFF2 64%,#FDF6EC 80%,#FFFFFF 100%);
  transition:opacity .7s ease, visibility .7s}
#splash.gone{opacity:0;visibility:hidden;pointer-events:none}
.sky{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;border-radius:50%;animation:tw 3.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.65)}50%{opacity:1;transform:scale(1.3)}}
.sparkle{position:absolute;pointer-events:none;animation:tw 4.2s ease-in-out infinite}
.sparkle:before,.sparkle:after{content:'';position:absolute;left:50%;top:50%;
  background:linear-gradient(90deg,rgba(255,236,190,0),#F6D98B,rgba(255,236,190,0));
  transform:translate(-50%,-50%)}
.sparkle:before{width:18px;height:1.6px}
.sparkle:after{width:1.6px;height:18px;
  background:linear-gradient(180deg,rgba(255,236,190,0),#F6D98B,rgba(255,236,190,0))}
.shoot{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;
  box-shadow:0 0 9px 2px rgba(255,241,205,.95);opacity:0;animation:shoot 9s ease-in infinite}
.shoot:after{content:'';position:absolute;right:2px;top:0;width:70px;height:1.6px;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(246,217,139,.95))}
@keyframes shoot{0%{opacity:0;transform:translate(0,0)}4%{opacity:1}
  17%{opacity:0;transform:translate(-200px,130px)}100%{opacity:0;transform:translate(-200px,130px)}}

.celestial{position:relative;width:268px;height:268px;margin:0 auto 4px}
.orbit{position:absolute;left:50%;top:50%;width:232px;height:232px;margin:-116px 0 0 -116px;
  border:1px dashed rgba(201,162,71,.42);border-radius:50%}
.glow{position:absolute;left:50%;top:50%;width:280px;height:280px;margin:-140px 0 0 -140px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,236,190,.55) 0,rgba(255,225,170,.22) 34%,
    rgba(214,232,255,.16) 56%,rgba(214,232,255,0) 74%);animation:pulse 5.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.93);opacity:.75}50%{transform:scale(1.07);opacity:1}}
.moon{position:absolute;left:50%;top:50%;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #FFFFFF 0 40%, #FFF7E4 62%, #FBE7C0 100%);
  box-shadow:inset -2px -2px 10px rgba(214,178,104,.4), inset 2px 3px 12px rgba(255,255,255,.9);
  -webkit-mask:radial-gradient(circle 66px at 101px 48px, transparent 0 66px, #000 66.5px);
  mask:radial-gradient(circle 66px at 101px 48px, transparent 0 66px, #000 66.5px);
  animation:bob 7s ease-in-out infinite}
.moonhalo{position:absolute;left:50%;top:50%;width:166px;height:166px;margin:-83px 0 0 -83px;border-radius:50%;
  background:radial-gradient(circle at 40% 44%, rgba(255,241,206,.9) 0 32%, rgba(255,232,178,.45) 52%,
    rgba(255,236,196,0) 72%);animation:bob 7s ease-in-out infinite;pointer-events:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.moon .cr{position:absolute;border-radius:50%;background:rgba(214,180,110,.22);z-index:2}
.moon .cr1{left:24px;top:33px;width:15px;height:15px}
.moon .cr2{left:43px;top:73px;width:11px;height:11px}
.moon .cr3{left:17px;top:68px;width:7px;height:7px}
.orbiter{position:absolute;left:50%;top:50%;width:232px;height:232px;margin:-116px 0 0 -116px;
  animation:spin 26s linear infinite}
.earth-pos{position:absolute;left:50%;top:-30px;transform:translateX(-50%);
  animation:spinRev 26s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinRev{to{transform:rotate(-360deg)}}
.globe{position:relative;width:60px;height:60px;filter:drop-shadow(0 0 14px rgba(47,98,184,.45))}
.globe svg{width:100%;height:100%;display:block}
.clouds{animation:drift 20s linear infinite}
@keyframes drift{to{transform:translateX(-56px)}}

.sp-names{position:relative;font-size:10.5px;letter-spacing:4.5px;font-weight:700;
  background:linear-gradient(90deg,#C9A227,#E0BE63,#C9A227);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.sp-title{position:relative;font-family:var(--serif);font-size:56px;font-weight:600;letter-spacing:2px;
  line-height:1;margin:8px 0 4px;
  background:linear-gradient(160deg,#2F62B8 0%,#5E97E6 45%,#8C79D8 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sp-rule{position:relative;width:70px;height:2px;margin:14px auto;border-radius:2px;
  background:linear-gradient(90deg,rgba(201,162,71,0),#C9A227,rgba(201,162,71,0))}
.sp-quote{position:relative;font-family:var(--serif);font-style:italic;font-size:22px;line-height:1.5;
  color:#3A5FA8;max-width:330px;margin:0 auto;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.sp-sub{position:relative;font-size:11px;letter-spacing:2.4px;color:#8B97B0;margin-top:14px}
.sp-btn{position:relative;margin-top:20px;border:0;border-radius:999px;padding:16px 42px;
  background:linear-gradient(120deg,#5E97E6 0%,#7E86E0 45%,#C9A227 130%);color:#fff;
  font-family:var(--sans);font-size:14px;font-weight:700;letter-spacing:1.4px;cursor:pointer;
  box-shadow:0 12px 30px rgba(47,98,184,.38), inset 0 1px 0 rgba(255,255,255,.35)}
.sp-hint{position:relative;font-size:10.5px;color:#9AA6BE;margin-top:11px;letter-spacing:.6px}
.ground{position:absolute;left:0;right:0;bottom:0;height:210px;pointer-events:none;overflow:hidden}
.hill{position:absolute;border-radius:50%}
.hill.b1{left:-46%;width:118%;bottom:-52px;height:172px;background:linear-gradient(180deg,#CDEDC9,#9EDAA6)}
.hill.b2{right:-46%;width:118%;bottom:-58px;height:160px;background:linear-gradient(180deg,#C2E8C0,#93D49D)}
.hill.front{left:-32%;width:164%;bottom:-124px;height:250px;
  background:linear-gradient(180deg,#8FD79A 0%,#61BB79 52%,#3E9862 100%);
  box-shadow:0 -2px 0 rgba(255,255,255,.35) inset}
.glowspot{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);
  width:330px;height:86px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,244,214,.9) 0,rgba(255,244,214,0) 70%)}
.fl{position:absolute;pointer-events:none;animation:bloom 6s ease-in-out infinite}
@keyframes bloom{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.07) rotate(2deg)}}

/* ===== HEADER ===== */
.top{position:sticky;top:0;z-index:20;padding:15px 18px 12px;
  background:linear-gradient(155deg,#FFFFFF 0%,#EAF3FE 34%,#DCE6FC 62%,#F8E9EE 100%);
  border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:9px;letter-spacing:3.4px;font-weight:700;
  background:linear-gradient(90deg,#C9A227,#E0BE63,#C9A227);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.ttl{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:.6px;
  background:linear-gradient(150deg,#2F62B8,#7B5FC4);-webkit-background-clip:text;
  background-clip:text;color:transparent;line-height:1.1}
.ttl small{display:block;font-family:var(--sans);font-size:9.5px;letter-spacing:2.6px;
  color:var(--muted);font-weight:500;margin-top:3px}
.top button{background:rgba(255,255,255,.72);border:1px solid var(--line);
  color:var(--ink2);border-radius:999px;padding:8px 13px;font:inherit;font-size:12px;cursor:pointer;
  font-weight:600}

.wrap{max-width:640px;margin:0 auto;padding:14px 14px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:13px;
  box-shadow:0 6px 20px rgba(47,98,184,.07)}

/* ===== TABS ===== */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#E8F1FD;
  border:1px solid var(--line2);border-radius:16px;padding:5px;margin-bottom:14px}
.tabs button{border:0;background:transparent;border-radius:12px;padding:11px 4px;font:inherit;
  font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.tabs button.on{background:#fff;color:var(--blue-d);box-shadow:0 3px 10px rgba(47,98,184,.16)}
.view{display:none}.view.on{display:block}

/* ===== FILTERS ===== */
.flt{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#F2F7FE;
  border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.flt button{border:0;background:transparent;border-radius:10px;padding:9px 2px;font:inherit;
  font-size:11.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.flt button.on{background:#fff;box-shadow:0 2px 7px rgba(47,98,184,.14)}
.dotc{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}

/* ===== MONTH GRID ===== */
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mnav b{font-family:var(--serif);font-size:23px;font-weight:700;letter-spacing:.4px;
  background:linear-gradient(150deg,#2F62B8,#7B5FC4);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.mnav button{background:linear-gradient(160deg,#FFFFFF,#EAF3FE);border:1px solid var(--line2);
  border-radius:50%;width:37px;height:37px;font-size:16px;cursor:pointer;color:var(--blue-d)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.gh{text-align:center;font-size:9.5px;color:var(--muted);padding:3px 0 6px;font-weight:600;letter-spacing:.6px}
.cell{min-height:58px;border:1px solid var(--line);border-radius:10px;background:#fff;
  padding:3px 3px 2px;font-size:10.5px;overflow:hidden;cursor:pointer}
.cell.pad{border-color:transparent;background:transparent;cursor:default}
.cell .dn{font-weight:700;font-size:11.5px;color:var(--ink2);line-height:1.2}
.cell.today .dn{background:var(--blue-d);color:#fff;border-radius:50%;
  width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px}
.cell.has{background:linear-gradient(168deg,#FFFFFF,#E9F2FE);border-color:var(--line2)}
.bar{border-radius:4px;padding:1px 3px;margin-top:2px;color:#fff;font-size:8.5px;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.cell .more{font-size:8px;color:var(--muted);line-height:1;margin-top:2px}

/* ===== EVENT ROWS ===== */
.ev{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .d{flex:0 0 54px;text-align:center;border-right:2px solid var(--line2);padding-right:9px}
.ev .d b{font-family:var(--serif);font-size:20px;white-space:nowrap;font-weight:700;display:block;line-height:1.1}
.ev .d span{font-size:10px;color:var(--muted);letter-spacing:.4px;display:block}
.ev .m{flex:1;min-width:0}
.ev .m .t{font-weight:600;font-size:14px;word-break:break-word}
.ev .m .s{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.ev.beer .d b{color:var(--beer)} .ev.beer .d{border-right-color:var(--beer)}
.ev.earth .d b{color:var(--earth)} .ev.earth .d{border-right-color:var(--earth)}
.ev.both .d b{color:var(--both)} .ev.both .d{border-right-color:var(--both)}
.tag{display:inline-block;border-radius:999px;padding:2px 8px;font-size:9.5px;font-weight:700;
  letter-spacing:.4px;margin-right:5px;margin-top:4px}
.tag.beer{background:#DCEAFC;color:var(--beer)}
.tag.earth{background:#FDE4EE;color:var(--earth)}
.tag.both{background:#EEE9FB;color:var(--both)}
.tag.q{background:#FDF3E2;color:#A8792C}
.monthhead{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:1px;
  color:var(--blue-d);margin:16px 0 2px;padding-bottom:5px;border-bottom:2px solid var(--blue-l)}
.monthhead:first-child{margin-top:0}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:24px 0;font-style:italic}
.daytitle{font-family:var(--serif);font-size:18px;font-weight:600;margin:0 0 6px}
.pastchk{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink2);margin-bottom:10px}
.pastchk input{width:18px;height:18px;accent-color:var(--blue-d);margin:0}

/* ===== STATUS ===== */
.note{border-radius:14px;padding:13px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.note.warn{background:#FDF6E6;border:1px solid #EFDDB4;color:#7A5A18}
.note.err{background:#FDEFEE;border:1px solid #EFC9C7;color:#8A4340}
.note b{display:block;margin-bottom:4px;font-size:13px}
.note code{background:rgba(0,0,0,.06);border-radius:5px;padding:1px 5px;font-size:11.5px;
  word-break:break-all}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--blue-l);
  border-top-color:var(--blue-d);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.foot{text-align:center;font-size:10.5px;color:var(--muted);padding:16px 0 6px;letter-spacing:.6px}
iframe.gcal{width:100%;height:520px;border:1px solid var(--line);border-radius:14px;background:#fff}
</style>
</head>
<body>

<div id="splash">
  <div class="sky" id="sky"></div>
  <div class="celestial">
    <div class="glow"></div><div class="orbit"></div><div class="moonhalo"></div>
    <div class="moon"><div class="cr cr1"></div><div class="cr cr2"></div><div class="cr cr3"></div></div>

  </div>
  <div class="sp-names">SASIPA &nbsp;&amp;&nbsp; KANTAPAT</div>
  <div class="sp-title">BE Plan</div>
  <div class="sp-rule"></div>
  <div class="sp-quote" id="spQuote">&ldquo;&rdquo;</div>
  <div class="sp-sub" id="spDate"></div>
  <button class="sp-btn" id="spEnter">ENTER OUR CALENDAR</button>
  <div class="sp-hint">no password &mdash; just us</div>
  <div class="ground" id="ground">
    <div class="hill b1"></div><div class="hill b2"></div><div class="hill front"></div>
    <div class="glowspot"></div>
  </div>
</div>

<div class="top">
  <div>
    <div class="brand">SASIPA &nbsp;&amp;&nbsp; KANTAPAT</div>
    <div class="ttl">B&amp;E<small>OUR CALENDAR</small></div>
  </div>
  <button id="btnReload">Refresh</button>
</div>

<div class="wrap">
  <div id="status"></div>

  <div class="tabs">
    <button class="on" data-v="next">The Week Ahead</button>
    <button data-v="month">Month</button>
    <button data-v="year">All Year</button>
  </div>

  <div class="view on" id="v-next">
    <div class="card">
      <div class="flt" id="fltNext"></div>
      <div class="daytitle" id="nextTitle">Coming up</div>
      <div id="nextList"><div class="empty"><span class="spin"></span> loading&hellip;</div></div>
    </div>
  </div>

  <div class="view" id="v-month">
    <div class="card">
      <div class="mnav">
        <button id="mPrev">&lsaquo;</button><b id="mLabel">&mdash;</b><button id="mNext">&rsaquo;</button>
      </div>
      <div class="flt" id="fltMonth"></div>
      <div class="grid" id="gridHead"></div>
      <div class="grid" id="gridBody"></div>
    </div>
    <div class="card" id="dayCard" style="display:none">
      <div class="daytitle" id="dayTitle">&mdash;</div>
      <div id="dayList"></div>
    </div>
  </div>

  <div class="view" id="v-year">
    <div class="card">
      <div class="flt" id="fltYear"></div>
      <label class="pastchk"><input type="checkbox" id="hidePast" checked> Hide months that have already passed</label>
      <div class="mnav">
        <button id="yPrev">&lsaquo;</button><b id="yLabel">&mdash;</b><button id="yNext">&rsaquo;</button>
      </div>
      <div id="yearList"><div class="empty"><span class="spin"></span> loading&hellip;</div></div>
    </div>
  </div>

  <div class="foot">read&#8209;only view &middot; to add or edit, open Google Calendar &rarr; B&amp;E</div>
</div>

var OWNER_N = {beer:'Beer', earth:'Earth', both:'Together'};
var QUOTES = [
  'You are the moon, I am the earth &mdash; always turning toward you.',
  'Every day with you blooms like hydrangeas after the rain.',
  'Between the moon and the earth, there is only us.',
  'I would cross the whole sky just to plan tomorrow with you.',
  'Blue skies, white clouds, and every single date with you.',
  'Some people are worth marking on every calendar.',
  'Our little universe &mdash; one day at a time.',
  'The moon keeps the night. You keep me.'
];

var ROWS = [];
var today = new Date();
var curY = today.getFullYear(), curM = today.getMonth()+1;
var yearShown = curY;
var FILTER = 'all';
var selDate = null;

function el(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pad2(n){return (n<10?'0':'')+n;}
function ymd(y,m,d){return y+'-'+pad2(m)+'-'+pad2(d);}
function todayYmd(){return ymd(today.getFullYear(),today.getMonth()+1,today.getDate());}
function serial(s){var a=String(s).split('-');return (+a[0])*10000+(+a[1])*100+(+a[2]);}
function dateOf(s){var a=String(s).split('-');return new Date(+a[0],+a[1]-1,+a[2]);}
function shiftYmd(s,days){var d=dateOf(s);d.setDate(d.getDate()+days);
  return ymd(d.getFullYear(),d.getMonth()+1,d.getDate());}
function daysInMonth(y,m){return new Date(y,m,0).getDate();}

/* ---------- WELCOME ---------- */
function flowerSvg(petal, size){
  var s = size || 26;
  return '<svg width="'+s+'" height="'+(s*1.5).toFixed(0)+'" viewBox="-16 -18 32 46">'
    + '<path d="M0 4 v16" stroke="#2F8A56" stroke-width="2.2" stroke-linecap="round"/>'
    + '<path d="M0 12 c-6 -1 -9 -4 -9 -7 c5 -1 8 2 9 7z" fill="#3E9862"/>'
    + '<circle cx="0" cy="-8.6" r="5.6" fill="'+petal+'"/>'
    + '<circle cx="8.2" cy="-2.7" r="5.6" fill="'+petal+'"/>'
    + '<circle cx="5" cy="7" r="5.6" fill="'+petal+'"/>'
    + '<circle cx="-5" cy="7" r="5.6" fill="'+petal+'"/>'
    + '<circle cx="-8.2" cy="-2.7" r="5.6" fill="'+petal+'"/>'
    + '<circle cx="0" cy="0" r="4" fill="#F7CE5B"/>'
    + '<circle cx="-1.2" cy="-1.2" r="1.4" fill="#FFF0BE"/></svg>';
}
function buildSplash(){
  var h='';
  for(var i=0;i<52;i++){
    var sz=(Math.random()*2.8+1.3).toFixed(1);
    h+='<span class="star" style="left:'+(Math.random()*100).toFixed(1)+'%;top:'+(Math.random()*66).toFixed(1)
      +'%;width:'+sz+'px;height:'+sz+'px;background:'+(i%5===0?'#FFF3D0':'#FFFFFF')
      +';box-shadow:0 0 8px 1px '+(i%5===0?'rgba(246,217,139,.95)':'rgba(126,167,228,.9)')
      +';animation-delay:'+(Math.random()*3.4).toFixed(1)+'s"></span>';
  }
  [[12,10],[84,7],[26,30],[74,26],[6,40],[92,34],[46,4],[62,44]].forEach(function(p,k){
    h+='<span class="sparkle" style="left:'+p[0]+'%;top:'+p[1]+'%;width:20px;height:20px;'
      +'animation-delay:'+(k*0.55).toFixed(2)+'s"></span>';
  });
  h+='<span class="shoot" style="left:88%;top:14%;animation-delay:2s"></span>';
  h+='<span class="shoot" style="left:70%;top:5%;animation-delay:6.5s"></span>';
  el('sky').innerHTML = h;

  var f='';
  [[6,52,'#FFFFFF',30],[13,30,'#F4A7C0',24],[20,62,'#C9B6EE',22],[27,26,'#FFFFFF',20],
   [34,46,'#9DC5F1',22],[68,44,'#FFFFFF',22],[75,24,'#F4A7C0',20],[82,58,'#9DC5F1',28],
   [89,32,'#FFFFFF',24],[95,54,'#C9B6EE',22],[58,20,'#FFFFFF',18],[44,18,'#F4A7C0',17]
  ].forEach(function(x,k){
    f+='<span class="fl" style="left:'+x[0]+'%;bottom:'+x[1]+'px;animation-delay:'+(k*0.4).toFixed(1)+'s">'
      + flowerSvg(x[2], x[3]) + '</span>';
  });
  el('ground').insertAdjacentHTML('beforeend', f);

  el('spQuote').innerHTML = '&ldquo;' + QUOTES[Math.floor(Math.random()*QUOTES.length)] + '&rdquo;';
  el('spDate').textContent = DAYS_EN[today.getDay()].toUpperCase() + '  \u00B7  '
    + MONTHS_EN[today.getMonth()+1].toUpperCase() + ' ' + today.getDate() + ', ' + today.getFullYear();
}
el('spEnter').addEventListener('click', function(){ el('splash').classList.add('gone'); });
el('splash').addEventListener('click', function(e){
  if(e.target.id==='splash') el('splash').classList.add('gone'); });

/* ---------- LOAD FROM GOOGLE CALENDAR ---------- */
function isoRange(){
  var a = new Date(curY, curM-1-CFG.monthsBack, 1);
  var b = new Date(curY, curM-1+CFG.monthsAhead, 1);
  return [a.toISOString(), b.toISOString()];
}
function parseEvent(e){
  var allDay = !!(e.start && e.start.date);
  var sd, ed, st='', et='';
  if(allDay){
    sd = e.start.date;
    ed = shiftYmd(e.end.date, -1);              // Google's end date is exclusive
    if(serial(ed) < serial(sd)) ed = sd;
  } else {
    /* Google returns "2026-09-05T19:00:00+07:00" already in the calendar's own
       time zone. Read the string directly — going through new Date() would
       re-render it in the phone's time zone and shift every hour. */
    var s = String(e.start.dateTime), en = String(e.end.dateTime);
    sd = s.slice(0,10);  st = s.slice(11,16);
    ed = en.slice(0,10); et = en.slice(11,16);
  }
  var desc = e.description || '';
  var m = desc.match(/\[BEPLAN\|(beer|earth|both)\]/i);
  var title = e.summary || '(no title)';
  var owner = m ? m[1].toLowerCase() : (/^\(\?\)?\s*B&E:|^B&E:/i.test(title) ? 'both' : 'beer');
  var tentative = /^\(\?\)/.test(title);
  var note = desc.replace(/\[BEPLAN(\|[a-z]+)?\]/ig,'')
                 .replace(/^\s*จากแผน:.*$/gm,'').trim();
  return {id:e.id, title:title.replace(/^\(\?\)\s*/,'').replace(/^B&E:\s*/i,''),
          rawTitle:title, startDate:sd, endDate:ed, startTime:st, endTime:et,
          allDay:allDay, owner:owner, tentative:tentative,
          location:e.location||'', note:note,
          recurring:!!(e.recurringEventId), link:e.htmlLink||''};
}
function showStatus(html){ el('status').innerHTML = html || ''; }

function load(){
  if(!CFG.apiKey){
    showStatus('<div class="note warn"><b>Almost there &mdash; one setting left</b>'
      + 'This page needs a Google API key to read the B&amp;E calendar. '
      + 'Open <code>index.html</code>, find the CONFIG block near the bottom, and paste your key into '
      + '<code>apiKey: \'\'</code>. Until then, here is the calendar itself:</div>'
      + '<iframe class="gcal" src="https://calendar.google.com/calendar/embed?src='
      + encodeURIComponent(CFG.calendarId) + '&amp;ctz=' + encodeURIComponent(CFG.timeZone)
      + '&amp;mode=MONTH&amp;showTitle=0&amp;showPrint=0&amp;showTabs=0&amp;showCalendars=0&amp;showTz=0"></iframe>');
    return;
  }
  var r = isoRange();
  var url = 'https://www.googleapis.com/calendar/v3/calendars/'
    + encodeURIComponent(CFG.calendarId) + '/events'
    + '?key=' + encodeURIComponent(CFG.apiKey)
    + '&singleEvents=true&orderBy=startTime&maxResults=2500'
    + '&timeMin=' + encodeURIComponent(r[0]) + '&timeMax=' + encodeURIComponent(r[1]);
  showStatus('<div class="note warn"><span class="spin"></span> Loading our plans&hellip;</div>');
  fetch(url).then(function(res){
    if(!res.ok) return res.json().then(function(j){ throw new Error(
      (j.error && j.error.message) || ('HTTP ' + res.status)); });
    return res.json();
  }).then(function(data){
    ROWS = (data.items||[]).filter(function(e){return e.status!=='cancelled';}).map(parseEvent);
    ROWS.sort(function(a,b){
      if(a.startDate !== b.startDate) return serial(a.startDate) - serial(b.startDate);
      if(a.allDay !== b.allDay) return a.allDay ? -1 : 1;          // all-day first
      return (a.startTime||'').localeCompare(b.startTime||'');
    });
    showStatus('');
    renderAll();
  }).catch(function(err){
    showStatus('<div class="note err"><b>Could not load the calendar</b>'
      + esc(err.message) + '<br><br>Usual causes: the B&amp;E calendar is not public yet, '
      + 'or the API key is restricted to a different website.</div>');
    ROWS = []; renderAll();
  });
}

/* ---------- SHARED BITS ---------- */
function keep(r){ return FILTER==='all' || r.owner===FILTER; }
function drawFilters(){
  var defs=[['all','All',''],['beer','Beer',OWNER_C.beer],
            ['earth','Earth',OWNER_C.earth],['both','Together',OWNER_C.both]];
  ['fltNext','fltMonth','fltYear'].forEach(function(id){
    var box=el(id); if(!box) return; box.innerHTML='';
    defs.forEach(function(d){
      var b=document.createElement('button');
      b.className = (FILTER===d[0]?'on':'');
      b.innerHTML = (d[2]?'<span class="dotc" style="background:'+d[2]+'"></span>':'') + d[1];
      b.onclick=function(){ FILTER=d[0]; renderAll(); };
      box.appendChild(b);
    });
  });
}
function dateLabel(r){
  var a=r.startDate.split('-'), b=r.endDate.split('-');
  if(r.startDate===r.endDate) return MON3[+a[1]]+' '+(+a[2]);
  if(a[1]===b[1]) return MON3[+a[1]]+' '+(+a[2])+'\u2013'+(+b[2]);
  return MON3[+a[1]]+' '+(+a[2])+' \u2013 '+MON3[+b[1]]+' '+(+b[2]);
}
function rowHtml(r){
  var a=r.startDate.split('-');
  var big = (r.startDate===r.endDate) ? (+a[2]) : ((+a[2])+'\u2013'+(+r.endDate.split('-')[2]));
  var sub=[];
  if(!r.allDay && r.startTime) sub.push(r.startTime + (r.endTime?('\u2013'+r.endTime):''));
  if(r.location) sub.push('\uD83D\uDCCD ' + esc(r.location));
  if(r.note) sub.push(esc(r.note));
  var tags = '<span class="tag '+r.owner+'">'+OWNER_N[r.owner]+'</span>'
    + (r.tentative?'<span class="tag q">not confirmed</span>':'')
    + (r.recurring?'<span class="tag q">repeats</span>':'');
  return '<div class="ev '+r.owner+'">'
    + '<div class="d"><b>'+big+'</b><span>'+MON3[+a[1]].toUpperCase()+'</span>'
    + '<span>'+DAY2[dateOf(r.startDate).getDay()].toUpperCase()+'</span></div>'
    + '<div class="m"><div class="t">'+esc(r.title)+'</div>'
    + (sub.length?'<div class="s">'+sub.join(' &middot; ')+'</div>':'')
    + '<div>'+tags+'</div></div></div>';
}

/* ---------- VIEW: NEXT ---------- */
function renderNext(){
  var a = todayYmd(), b = shiftYmd(a, 30);
  var rows = ROWS.filter(function(r){
    return keep(r) && serial(r.endDate)>=serial(a) && serial(r.startDate)<=serial(b);
  });
  el('nextTitle').textContent = 'Next 30 days \u00B7 ' + rows.length + ' plan' + (rows.length===1?'':'s');
  el('nextList').innerHTML = rows.length ? rows.map(rowHtml).join('')
    : '<div class="empty">Nothing on the calendar yet \u2014 a quiet month for us.</div>';
}

/* ---------- VIEW: MONTH ---------- */
function renderMonth(){
  el('mLabel').textContent = MONTHS_EN[curM] + ' ' + curY;
  el('gridHead').innerHTML = DAY2.map(function(d){return '<div class="gh">'+d.toUpperCase()+'</div>';}).join('');
  var first = new Date(curY, curM-1, 1).getDay(), n = daysInMonth(curY, curM), h='';
  for(var i=0;i<first;i++) h+='<div class="cell pad"></div>';
  for(var d=1;d<=n;d++){
    var key = ymd(curY, curM, d), k = serial(key);
    var list = ROWS.filter(function(r){
      return keep(r) && k>=serial(r.startDate) && k<=serial(r.endDate); });
    var cls = 'cell' + (list.length?' has':'') + (key===todayYmd()?' today':'');
    h += '<div class="'+cls+'" data-d="'+key+'"><div class="dn">'+d+'</div>';
    list.slice(0,3).forEach(function(r){
      h += '<div class="bar" style="background:'+OWNER_C[r.owner]+'">'+esc(r.title)+'</div>'; });
    if(list.length>3) h += '<div class="more">+'+(list.length-3)+' more</div>';
    h += '</div>';
  }
  el('gridBody').innerHTML = h;
  Array.prototype.forEach.call(el('gridBody').querySelectorAll('.cell:not(.pad)'), function(c){
    c.onclick = function(){ openDay(c.getAttribute('data-d')); };
  });
  if(selDate) openDay(selDate, true);
}
function openDay(key, quiet){
  selDate = key;
  var k = serial(key);
  var rows = ROWS.filter(function(r){ return keep(r) && k>=serial(r.startDate) && k<=serial(r.endDate); });
  var d = dateOf(key);
  el('dayCard').style.display = 'block';
  el('dayTitle').textContent = DAYS_EN[d.getDay()] + ', ' + MONTHS_EN[curM] + ' ' + d.getDate();
  el('dayList').innerHTML = rows.length ? rows.map(rowHtml).join('')
    : '<div class="empty">Nothing planned on this day.</div>';
  if(!quiet) el('dayCard').scrollIntoView({behavior:'smooth', block:'nearest'});
}

/* ---------- VIEW: YEAR ---------- */
function renderYear(){
  el('yLabel').textContent = yearShown;
  var hidePast = el('hidePast').checked, t = todayYmd(), h = '', total = 0;
  for(var m=1;m<=12;m++){
    var rows = ROWS.filter(function(r){
      if(!keep(r)) return false;
      var a = r.startDate.split('-');
      if(+a[0]!==yearShown || +a[1]!==m) return false;
      if(hidePast && yearShown===curY && serial(r.endDate) < serial(t)) return false;
      return true;
    });
    if(hidePast && yearShown===curY && m<curM && !rows.length) continue;
    if(!rows.length) continue;
    total += rows.length;
    h += '<div class="monthhead">'+MONTHS_EN[m].toUpperCase()+'</div>' + rows.map(rowHtml).join('');
  }
  el('yearList').innerHTML = total ? h
    : '<div class="empty">No plans for '+yearShown+' yet.</div>';
}

function renderAll(){ drawFilters(); renderNext(); renderMonth(); renderYear(); }

/* ---------- WIRING ---------- */
Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function(b){
  b.onclick = function(){
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function(x){
      x.classList.remove('on'); });
    b.classList.add('on');
    Array.prototype.forEach.call(document.querySelectorAll('.view'), function(v){
      v.classList.remove('on'); });
    el('v-' + b.getAttribute('data-v')).classList.add('on');
  };
});
el('mPrev').onclick = function(){ curM--; if(curM<1){curM=12;curY--;} selDate=null;
  el('dayCard').style.display='none'; renderMonth(); };
el('mNext').onclick = function(){ curM++; if(curM>12){curM=1;curY++;} selDate=null;
  el('dayCard').style.display='none'; renderMonth(); };
el('yPrev').onclick = function(){ yearShown--; renderYear(); };
el('yNext').onclick = function(){ yearShown++; renderYear(); };
el('hidePast').onchange = renderYear;
el('btnReload').onclick = load;

buildSplash();
load();
</script>
